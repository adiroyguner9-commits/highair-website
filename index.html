    <!-- Fonts preload: only the faces the first screen draws, chosen by host
         because www (Hebrew) and en. (English) serve this same HTML. Hebrew:
         Ploni Bold / Medium / Regular (the faces global.css defines) + Mazzard
         Bold for the hero brand line. English: Mazzard only. Kept first in
         <head> so nothing blocking runs before it (23 Oct 2026: the old static
         preloads fetched two .otf files no rule used, ~250 KB wasted). -->
    <script>
      (function () {
        var files = location.hostname.indexOf('en.') === 0
          ? ['MazzardH-Regular.woff2', 'MazzardH-Bold.woff2']
          : ['Ploni-Bold-AAA.woff2', 'Ploni-Medium-AAA.woff2', 'Ploni-Regular-AAA.woff2', 'MazzardH-Bold.woff2'];
        for (var i = 0; i < files.length; i++) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous';
          l.href = '/' + files[i];
          document.head.appendChild(l);
        }
      })();
    </script>

    <!-- Google Tag Manager -->

    })(window,document,'script','dataLayer','GTM-MVJ7Z7FB');</script>

    <!-- Google Analytics - GTM (above) is the ONE loader.
         Measured 24 Oct 2026: the page also loaded gtag.js itself, and both
         runtimes read the same dataLayer, so every command ran twice: GA's
         library downloaded twice (~195KB each), the Google Ads remarketing hit
         fired 4 times per page view, and the retired Ads account AW-6948606470
         (no conversion anywhere points at it) loaded its own 149KB. GTM's own
         Google tag already configures AW-16520015098 and its lead/purchase
         conversions, so the page only queues the GA config; GTM loads it.
         Consent default stays where it always was (after the GTM snippet). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied' });
      if (localStorage.getItem('highair_cookie_consent') === 'accepted') {
        gtag('consent', 'update', { analytics_storage: 'granted', ad_storage: 'granted' });
      }
      gtag('js', new Date());
      gtag('config', 'G-5XBRSD9V1M', { send_page_view: false });
    </script>

    <!-- Meta Pixel 293738523242679: fired by GTM's Meta Pixel tag (PageView on
         every page, Lead on the dataLayer 'lead' event). It was ALSO loaded
         here, so every page view reached Meta twice (measured 24 Oct 2026).
         The noscript image in <body> stays for visitors without JavaScript. -->

    <!-- UserWay Accessibility Widget -->
    <!-- defer: it used to block the page parse on every load (23 Oct 2026) -->
    <script
      defer
      src="https://cdn.userway.org/widget.js"
      data-account="rpURKYiNcS"
      data-position="bottom-left"
      data-offset-x="28"
      data-offset-y="86"
    ></script>
    <style>
      /* UserWay - 58px circle bottom-left, stacked above WhatsApp button */
      #userwayAccessibilityIcon,
      .userway_buttons_wrapper,
      [id^="userwayAccessibilityIcon"] {
        position: fixed !important;
        top: auto !important;
        right: auto !important;
        bottom: 86px !important;
        left: 28px !important;
        width:  46px !important;
        height: 46px !important;
        border-radius: 50% !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        transition: bottom 0.35s cubic-bezier(0.22,1,0.36,1) !important;
      }
      /* When the cookie banner covers this corner (narrow screens), lift the
         accessibility button above it. The banner sets --ha-cookie-clear on
         <html> and toggles .ha-cookie-open on <body>; WhatsApp sits at the var,
         and this button stacks ~58px above it. */
      body.ha-cookie-open #userwayAccessibilityIcon,
      body.ha-cookie-open .userway_buttons_wrapper,
      body.ha-cookie-open [id^="userwayAccessibilityIcon"] {
        bottom: calc(var(--ha-cookie-clear, 86px) + 58px) !important;
      }
      /* The clickable button element UserWay renders */
      #userwayAccessibilityIcon button,
      .userway_buttons_wrapper button,
      [id^="userwayAccessibilityIcon"] button {
        width:  46px !important;
        height: 46px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0 !important;
        margin: 0 !important;
        clip-path: none !important;
      }
      /* SVG / img icon inside the button */
      #userwayAccessibilityIcon button svg,
      #userwayAccessibilityIcon button img,
      .userway_buttons_wrapper button svg,
      .userway_buttons_wrapper button img,
      [id^="userwayAccessibilityIcon"] button svg,
      [id^="userwayAccessibilityIcon"] button img {
        width:  24px !important;
        height: 24px !important;
        display: block !important;
      }
    </style>
    <!-- End UserWay -->
